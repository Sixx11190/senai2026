<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galcio | Moda Versátil para Todos os Estilos</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">GALCIO</div>
        <nav>
            <a href="#">Início</a>
            <a href="#">Coleções</a>
            <a href="#">Sobre Nós</a>
            <a href="#contato" id="link-contato">Contato</a>
        </nav>
    </header>

    <section class="hero" id="inicio">
        <h1>Bem-vindo ao Galcio</h1>
        <p>Uma extensão da sua alma</p>
        <a href="#colecoes" class="btn">Explorar Coleções</a>
    </section>

    <div class="container" id="colecoes">
        <h2 class="section-title">Nossas Coleções</h2>

        <div class="grid-produtos">
            <div class="card-produto">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600&auto=format&fit=crop" alt="Look Casual Elegante">
                <div class="card-info">
                    <h3>Casual Elegante</h3>
                    <p>R$ 249,90</p>
                    <button class="btn-comprar" onclick="alertaproduto('casual elegante')">Comprar

                    </button>
                </div>
            </div>

            <div class="card-produto">
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=600&auto=format&fit=crop" alt="Look Urbano">
                <div class="card-info">
                    <h3>Look Urbano</h3>
                    <p>R$ 189,90</p>
                    <button class="btn-comprar" onclick="alertaproduto('look urbano')">Comprar</button>
                </div>
            </div>

            <div class="card-produto">
                <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=600&auto=format&fit=crop" alt="Look Minimalista">
                <div class="card-info">
                    <h3>Look Minimalista</h3>
                    <p>R$ 152,90</p>
                    <button class="btn-comprar" onclick="alertaproduto('look minimalista')">Comprar</button>
                </div>
            </div>
        </div>
    </div>

    <footer id="contato">
        <p>&copy; 2026 Galcio. Todos os direitos reservados.</p>
    </footer>
    
    <script>
        function alertaProduto(nomeProduto) {
            alert("voce clicou em comprar no produto: " + nomeProduto + "!\nEm breve conectaremos você para finalizar a compra.");
        }

        document.getElementById('link-contato').addEventListener('click', function(e){
            console.log("O usuario clicou no link de contato.");
        });
    </script>
    
</body>
</html>
